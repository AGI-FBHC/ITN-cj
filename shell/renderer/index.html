<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>ITN-Desktop · 本地教培工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f7053'/%3E%3Ctext x='16' y='21' font-family='Segoe UI,sans-serif' font-size='13' font-weight='700' fill='%23f2f8f4' text-anchor='middle'%3EITN%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="titlebar" class="titlebar">
    <div class="tb-brand">
      <span class="tb-mark">ITN</span>
      <span class="tb-name">教培工作台</span>
      <span class="tb-sub">本地运行 · 资料不出本机</span>
    </div>
    <div class="tb-drag"></div>
    <div class="tb-controls">
      <button id="win-min" class="tb-btn" type="button" aria-label="最小化" title="最小化">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" /></svg>
      </button>
      <button id="win-max" class="tb-btn" type="button" aria-label="最大化" title="最大化">
        <svg class="icon-max" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" rx="1.2" /></svg>
        <svg class="icon-restore" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="3.6" width="6.4" height="6.4" rx="1.1" /><path d="M4.4 3.6V2.4A1 1 0 0 1 5.4 1.4h4.2a1 1 0 0 1 1 1v4.2a1 1 0 0 1-1 1h-1.2" /></svg>
      </button>
      <button id="win-close" class="tb-btn tb-close" type="button" aria-label="关闭窗口" title="关闭窗口">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3L3 9" /></svg>
      </button>
    </div>
  </header>
  <div class="app">
    <aside class="sidebar">
      <button id="nav-search" class="nav-search">
        <span>检索资料与笔记</span><kbd>Ctrl K</kbd>
      </button>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot"><span id="status" class="status">连接中…</span></div>
    </aside>
    <aside id="session-rail" class="session-rail" hidden>
      <div class="rail-head">
        <div class="rail-title">对话</div>
        <button id="rail-new" class="btn sm primary">＋ 新建</button>
      </div>
      <input id="rail-search" class="rail-search" placeholder="搜索会话标题">
      <div id="rail-list" class="rail-list"></div>
      <div class="rail-foot"><button id="rail-all" class="btn ghost sm">全部会话与步骤 →</button></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-text">
          <h1 id="page-title">我的学习</h1>
          <p id="page-sub"></p>
        </div>
        <div id="top-actions" class="top-actions"></div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>
  <div id="palette" class="palette" hidden></div>
  <div id="player" class="player" hidden></div>
  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
