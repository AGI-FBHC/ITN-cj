<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>ITN-Desktop · 本地教培工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f7053'/%3E%3Ctext x='16' y='21' font-family='Segoe UI,sans-serif' font-size='13' font-weight='700' fill='%23f2f8f4' text-anchor='middle'%3EITN%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">ITN</div>
        <div class="brand-text"><strong>教培工作台</strong><span>本地运行 · 无后端</span></div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot"><span id="status" class="status">连接中…</span></div>
    </aside>
    <aside id="session-rail" class="session-rail" hidden>
      <div class="rail-head">
        <div class="rail-title">对话</div>
        <button id="rail-new" class="btn sm primary">＋ 新建</button>
      </div>
      <input id="rail-search" class="rail-search" placeholder="搜索会话标题">
      <div id="rail-list" class="rail-list"></div>
      <div class="rail-foot"><button id="rail-all" class="btn ghost sm">全部会话与步骤 →</button></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-text">
          <h1 id="page-title">我的学习</h1>
          <p id="page-sub"></p>
        </div>
        <div id="top-actions" class="top-actions"></div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
