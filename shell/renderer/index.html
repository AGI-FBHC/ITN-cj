<body>
  <header id="titlebar" class="titlebar">
    <div class="tb-brand">
      <img class="tb-logo" src="/logo-mark.png" alt="Lumin" draggable="false">
      <span class="tb-name">LUMIN</span>
    </div>
    <div class="tb-nav">
      <button id="nav-back" class="tb-btn" type="button" aria-label="后退" title="后退">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" /></svg>
      </button>
      <button id="nav-forward" class="tb-btn" type="button" aria-label="前进" title="前进">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" /></svg>
      </button>
      <button id="rail-toggle" class="tb-btn" type="button" aria-label="显示/隐藏侧栏" title="显示/隐藏侧栏（Ctrl+Shift+S）">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.6" /><path d="M6.5 3v10" /></svg>
      </button>
    </div>
    <div class="tb-drag"></div>
    <div class="tb-status">
      <span id="status" class="status">连接中…</span>
    </div>
    <div class="tb-controls">
      <button id="win-min" class="tb-btn" type="button" aria-label="最小化" title="最小化">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" /></svg>
      </button>
      <button id="win-max" class="tb-btn" type="button" aria-label="最大化" title="最大化">
        <svg class="icon-max" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" rx="1.2" /></svg>
        <svg class="icon-restore" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="3.6" width="6.4" height="6.4" rx="1.1" /><path d="M4.4 3.6V2.4A1 1 0 0 1 5.4 1.4h4.2a1 1 0 0 1 1 1v4.2a1 1 0 0 1-1 1h-1.2" /></svg>
      </button>
      <button id="win-close" class="tb-btn tb-close" type="button" aria-label="关闭窗口" title="关闭窗口">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3L3 9" /></svg>
      </button>
    </div>
  </header>
  <div class="app">
    <nav id="rail" class="rail"></nav>
    <aside id="panel" class="panel">
      <header class="panel-head">
        <span id="panel-title" class="panel-title"></span>
        <span id="panel-actions" class="panel-actions"></span>
      </header>
      <div id="panel-body" class="panel-body"></div>
      <footer id="panel-foot" class="panel-foot"></footer>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-text">
          <h1 id="page-title">我的学习</h1>
          <p id="page-sub"></p>
        </div>
        <div id="top-actions" class="top-actions"></div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>
  <div id="palette" class="palette" hidden></div>
  <div id="player" class="player" hidden></div>
  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
  <script src="/workbench.js"></script>
</body>
