[package]
  cjc-version = "1.1.3"
  name = "web"
  description = ""
  version = "1.0.0"
  target-dir = ""
  src-dir = ""
  output-type = "executable"
  compile-option = "-lcangjie-dynamicLoader-opensslFFI"
  override-compile-option = ""
  link-option = ""
  package-configuration = {}

[dependencies]
  soulsoft_web_http = "1.0.20260528"
  soulsoft_web_routing = "1.0.20260528"
  soulsoft_web_hosting = "1.0.20260528"
  soulsoft_extensions_injection = "1.0.20260528"

[target]
  [target.x86_64-w64-mingw32]
    compile-option = '-Woff unused --diagnostic-format=noColor -Woff deprecated -lcrypt32 -L "C:/Program Files/MySQL/MySQL Server 8.4/lib" -lmysql'
    [target.x86_64-w64-mingw32.bin-dependencies]
      path-option = [ "${CANGJIE_STDX_PATH}" ]
  [target.x86_64-unknown-linux-gnu]
    compile-option = "-Woff unused --diagnostic-format=noColor -Woff deprecated -ldl -lmysqlclient"
    [target.x86_64-unknown-linux-gnu.bin-dependencies]
      path-option = [ "${CANGJIE_STDX_PATH}" ]
  [target.aarch64-unknown-linux-gnu]
    compile-option = "-Woff unused --diagnostic-format=noColor -Woff deprecated -ldl -lmysqlclient"
    [target.aarch64-unknown-linux-gnu.bin-dependencies]
      path-option = [ "${CANGJIE_STDX_PATH}" ]
