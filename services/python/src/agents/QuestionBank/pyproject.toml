[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "questionbank"
version = "0.1.0"
description = "ITN Question Bank - 题库独立模块（Knowledge Core 是唯一知识入口）"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.24.0",
    "pymysql>=1.1.0",
    "click>=8.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
qb = "questionbank.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/questionbank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
