name: itn-cangjie-stack

services:
  business:
    image: itn-cangjie-sdk:1.1.3-mysql
    container_name: itn-cj-business
    restart: unless-stopped
    working_dir: /app
    command: ["/app/main"]
    env_file:
      - env/business.env
    volumes:
      - ./app/business:/app:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    networks:
      - stack
      - itn_default
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/hello', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    image: itn-cangjie-sdk:1.1.3
    container_name: itn-cj-api
    restart: unless-stopped
    working_dir: /app
    command: ["/app/main"]
    env_file:
      - env/api.env
    volumes:
      - ./app/api:/app:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    networks:
      - stack
      - itn_default
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: nginx:1.27-alpine
    container_name: itn-cj-web
    restart: unless-stopped
    ports:
      - "20889:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
      - /tmp:size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - stack
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  stack:
    name: itn-cangjie-stack
  itn_default:
    external: true