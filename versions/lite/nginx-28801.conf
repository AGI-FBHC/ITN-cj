server {
    listen 28801;
    listen [::]:28801;
    server_name _;

    root /var/www/zhixun-yunshu/current;
    index index.html;

    location = /courses {
        try_files /index.html =404;
    }

    location = /courses/ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* ^/assets/.*\.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }
}
