<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="多智能体协作插画">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F6EF"/>
      <stop offset="0.6" stop-color="#EEF3EC"/>
      <stop offset="1" stop-color="#E4EDE5"/>
    </linearGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#7FB295" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7FB295" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg3)"/>
  <rect width="1200" height="675" fill="url(#glow3)"/>

  <!-- 圆桌 -->
  <ellipse cx="600" cy="470" rx="300" ry="86" fill="#4E7860" opacity="0.14" filter="url(#soft3)"/>
  <ellipse cx="600" cy="462" rx="290" ry="78" fill="#FBFAF5" stroke="#DCE6DE" stroke-width="3"/>
  <ellipse cx="600" cy="462" rx="210" ry="52" fill="#F1F6F0" stroke="#DCE6DE" stroke-width="2"/>

  <!-- 协作连线 -->
  <g stroke="#B77552" stroke-width="2.5" stroke-dasharray="7 9" fill="none" opacity="0.5">
    <path d="M600 300 L600 410"/>
    <path d="M380 250 L540 405"/>
    <path d="M820 250 L660 405"/>
  </g>

  <!-- 主体机器人 -->
  <g>
    <rect x="540" y="180" width="120" height="104" rx="30" fill="#4E7860"/>
    <rect x="556" y="196" width="88" height="60" rx="20" fill="#F8F6EF"/>
    <circle cx="582" cy="226" r="8" fill="#4E7860"/>
    <circle cx="618" cy="226" r="8" fill="#4E7860"/>
    <path d="M584 244 Q600 254 616 244" stroke="#4E7860" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="592" y="152" width="16" height="30" rx="8" fill="#7FB295"/>
    <circle cx="600" cy="146" r="11" fill="#E7B45A"/>
  </g>

  <!-- 左侧机器人 -->
  <g>
    <rect x="296" y="196" width="100" height="86" rx="26" fill="#A8D4BA"/>
    <rect x="310" y="210" width="72" height="50" rx="16" fill="#FDFCF8"/>
    <circle cx="332" cy="234" r="7" fill="#4E7860"/>
    <circle cx="360" cy="234" r="7" fill="#4E7860"/>
    <rect x="342" y="172" width="14" height="26" rx="7" fill="#7FB295"/>
    <circle cx="349" cy="166" r="9" fill="#B77552"/>
  </g>

  <!-- 右侧机器人 -->
  <g>
    <rect x="804" y="196" width="100" height="86" rx="26" fill="#E7B45A" opacity="0.85"/>
    <rect x="818" y="210" width="72" height="50" rx="16" fill="#FDFCF8"/>
    <circle cx="840" cy="234" r="7" fill="#4E7860"/>
    <circle cx="868" cy="234" r="7" fill="#4E7860"/>
    <rect x="848" y="172" width="14" height="26" rx="7" fill="#D9A247"/>
    <circle cx="855" cy="166" r="9" fill="#4E7860"/>
  </g>

  <!-- 桌上任务卡 -->
  <g>
    <rect x="520" y="440" width="160" height="44" rx="12" fill="#FFFFFF" stroke="#DCE6DE" stroke-width="2"/>
    <rect x="540" y="454" width="72" height="9" rx="4.5" fill="#C9DCCF"/>
    <rect x="540" y="468" width="46" height="9" rx="4.5" fill="#DCE6DE"/>
    <circle cx="656" cy="462" r="9" fill="#4E7860" opacity="0.5"/>
  </g>

  <!-- 周围散点 -->
  <g fill="#4E7860" opacity="0.14">
    <circle cx="180" cy="140" r="5"/><circle cx="230" cy="110" r="3"/><circle cx="160" cy="196" r="3"/>
    <circle cx="1030" cy="130" r="5"/><circle cx="1080" cy="168" r="3"/><circle cx="1000" cy="190" r="3"/>
  </g>
</svg>
